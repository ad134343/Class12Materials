<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Class 12 — Study Index</title>
    <meta name="theme-color" content="#121218">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

    <!-- Shared AM monogram — every placement below references this via
         <use>, so the mark stays pixel-identical everywhere and only
         needs updating in one place. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="am-mark" viewBox="0 0 276 177">
            <g transform="translate(0,177) scale(0.1,-0.1)" stroke="none">
                <path d="M749 1603 c-11 -27 -91 -212 -176 -413 -86 -201 -223 -522 -304 -714
                -82 -191 -149 -352 -149 -357 l0 -9 168 0 169 0 69 170 69 170 258 0 257 0 0
                8 c-1 4 -27 70 -59 147 l-57 140 -137 3 c-75 1 -137 4 -137 6 0 2 43 108 95
                235 52 128 95 236 95 242 0 36 30 -29 142 -304 70 -171 173 -426 230 -565
                l102 -252 177 0 177 0 -67 158 c-38 86 -117 272 -177 412 -59 140 -176 415
                -259 610 l-152 355 -157 3 -156 3 -21 -48z"/>
                <path d="M1220 1637 c0 -1 53 -127 118 -278 l119 -276 206 -312 c114 -171 210
                -311 214 -311 5 0 104 145 221 322 l212 322 0 -497 0 -497 170 0 170 0 0 765
                0 765 -183 0 -183 0 -199 -320 c-110 -176 -202 -320 -205 -320 -3 0 -93 143
                -202 318 l-196 317 -131 3 c-72 1 -131 1 -131 -1z"/>
            </g>
        </symbol>
    </svg>

    <!-- ═══ NAME GATE / COVER ═══ -->
    <div id="gate" class="gate">
        <div class="gate__bg"></div>
        <div class="gate__glow"></div>
        <div class="gate__noise"></div>

        <span class="gate__spine">ISC · Class XII · Study Index</span>

        <div class="gate__content">
            <svg class="am-mark am-mark--gate" aria-hidden="true"><use href="#am-mark" xlink:href="#am-mark"></use></svg>
            <p class="gate__eyebrow">Welcome to</p>
            <h1 class="gate__title">Class 12</h1>
            <div class="gate__divider"></div>
            <p class="gate__subtitle">Please enter your name</p>
            <form id="nameForm" class="gate__form">
                <div class="gate__field">
                    <input type="text" id="nameInput" class="gate__input" placeholder="Your name" required autocomplete="off" minlength="2">
                    <span class="gate__field-line"></span>
                </div>
                <button type="submit" class="gate__btn">
                    <span class="gate__btn-label">Continue</span>
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                </button>
            </form>
            <p id="gateError" class="gate__error hidden"></p>
        </div>
    </div>

    <!-- ═══ MAIN APP ═══ -->
    <div id="app" class="app hidden">

        <nav class="nav">
            <div class="nav__inner">
                <button class="nav__logo" id="homeBtn">
                    <svg class="am-mark am-mark--nav" aria-hidden="true"><use href="#am-mark" xlink:href="#am-mark"></use></svg>
                    <span>Class 12</span>
                </button>
                <div class="nav__right">
                    <span class="nav__greeting" id="greeting"></span>
                    <button class="nav__user" id="logoutBtn" aria-label="Sign out" title="Sign out">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </button>
                </div>
            </div>
        </nav>

        <div class="shell">
            <nav id="breadcrumb" class="crumbs"></nav>
            <main id="content" class="content"></main>
        </div>

        <footer class="foot">
            <p>Made with care for exam season</p>
            <p class="foot__credit">
                <svg class="am-mark am-mark--foot" aria-hidden="true"><use href="#am-mark" xlink:href="#am-mark"></use></svg>
                Designed by AM
            </p>
        </footer>
    </div>

    <!-- ═══ PDF VIEWER ═══ -->
    <div id="viewer" class="viewer hidden">
        <div class="viewer__overlay" id="viewerOverlay"></div>
        <div class="viewer__shell">
            <div class="viewer__bar">
                <div class="viewer__brand">
                    <svg class="am-mark am-mark--viewer" aria-hidden="true"><use href="#am-mark" xlink:href="#am-mark"></use></svg>
                    <div class="viewer__brand-text">
                        <span class="viewer__credit">Prepared by <svg class="am-mark am-mark--credit" aria-hidden="true"><use href="#am-mark" xlink:href="#am-mark"></use></svg></span>
                        <span class="viewer__name" id="viewerName">Document.pdf</span>
                    </div>
                </div>
                <div class="viewer__actions">
                    <div class="viewer__zoom">
                        <button id="viewerZoomOut" class="viewer__zoom-btn" aria-label="Zoom out">−</button>
                        <span id="viewerZoomLabel" class="viewer__zoom-label">100%</span>
                        <button id="viewerZoomIn" class="viewer__zoom-btn" aria-label="Zoom in">+</button>
                    </div>
                    <button id="viewerClose" class="viewer__btn viewer__btn--close" aria-label="Close">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
            </div>
            <div id="viewerPages" class="viewer__pages"></div>
        </div>
    </div>

    <script src="config.js?v=4"></script>
    <script src="script.js?v=4"></script>
</body>
</html>
